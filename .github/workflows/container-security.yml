name: Container Build and Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Build Test and Scan Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: preview-environment-platform:test

      - name: Test dry-run container
        run: |
          docker run --rm preview-environment-platform:test

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: preview-environment-platform:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
